; Example PJSIP auth credentials file.
;
; This file is a TEMPLATE only. It must never contain a real password and
; must never be deployed as-is.
;
; Setup on the Asterisk server:
;   1. cp pjsip_auth.example.conf /etc/asterisk/pjsip_auth.conf
;      (adjust the path if this server's Asterisk config directory differs)
;   2. Edit /etc/asterisk/pjsip_auth.conf and fill in the real, rotated
;      SIP passwords for MEDIATEL and PHONEGROUP.
;   3. chown root:asterisk /etc/asterisk/pjsip_auth.conf
;      chmod 640 /etc/asterisk/pjsip_auth.conf
;      (adjust the group to whichever account actually runs Asterisk on
;      this server if it is not "asterisk")
;   4. asterisk -rx "pjsip reload"
;
; pjsip.conf includes this exact filename (#include pjsip_auth.conf) and
; resolves it relative to Asterisk's own config directory. Nothing under
; the git repository should ever hold the real passwords.
;
; PHONEGROUP is actively referenced by [PHONEGROUP] via auth=PHONEGROUP-auth.
; MEDIATEL is NOT currently referenced by any endpoint's auth= line — this
; section is kept for parity/future use but has no effect on authentication
; today. Do not add an auth= line to [MEDIATEL] as part of this change; that
; would be a SIP routing/behavior change, out of scope here.

[MEDIATEL-auth]
type=auth
auth_type=userpass
username=mediatel
password=REPLACE_WITH_ROTATED_PASSWORD

[PHONEGROUP-auth]
type=auth
auth_type=userpass
username=phonegroup
password=REPLACE_WITH_ROTATED_PASSWORD
