[general]
static=yes
writeprotect=no

[block-unauthorized]
exten => _X.,1,Hangup(21)

[from-carrier]
exten => _+X.,1,NoOp(6G Premium — Inbound: ${EXTEN})
same => n,Set(CALL_START=${EPOCH})
same => n,AGI(did_router.php)
same => n,Progress()
same => n,Answer()
same => n,Set(TIMEOUT(absolute)=3600)
same => n(loop),Playback(${IVR_CONTEXT})
same => n,Wait(1)
same => n,Goto(loop)

exten => _00X.,1,Goto(from-carrier,+${EXTEN:2},1)
exten => _X.,1,Goto(from-carrier,+${EXTEN},1)

exten => h,1,NoOp(CDR SAVE START - billsec=${CDR(billsec)})
same => n,System(echo "$(date) h-fired did=${CDR(dst)} billsec=${CDR(billsec)}" >> /tmp/h_test.log)
same => n,AGI(save_cdr.php,${CDR(src)},${CDR(dst)},${CDR(billsec)},${TARIFF},${IVR_CONTEXT},${CHANNEL})
same => n,System(/usr/local/bin/import_cdr.sh >> /tmp/cdr_import.log 2>&1 &)

; Purple requires 180 Ringing instead of the 183 Session Progress that
; [from-carrier] sends via Progress() - same flow otherwise.
[from-carrier-purple]
exten => _+X.,1,NoOp(6G Premium — Inbound (Purple): ${EXTEN})
same => n,Set(CALL_START=${EPOCH})
same => n,AGI(did_router.php)
same => n,Ringing()
same => n,Answer()
same => n,Set(TIMEOUT(absolute)=3600)
same => n(loop),Playback(${IVR_CONTEXT})
same => n,Wait(1)
same => n,Goto(loop)

exten => _00X.,1,Goto(from-carrier-purple,+${EXTEN:2},1)
exten => _X.,1,Goto(from-carrier-purple,+${EXTEN},1)

exten => h,1,NoOp(CDR SAVE START - billsec=${CDR(billsec)})
same => n,AGI(save_cdr.php,${CDR(src)},${CDR(dst)},${CDR(billsec)},${TARIFF},${IVR_CONTEXT},${CHANNEL})
same => n,System(/usr/local/bin/import_cdr.sh >> /tmp/cdr_import.log 2>&1 &)

[default]
exten => s,1,Hangup(21)

; === BEGIN MANAGED DIALPLAN - generated by Asterisk Configuration module, do not edit ===

[from-suppliers]

exten => _X.,1,NoOp(6G PREMIUM TELECOM INBOUND)
 same => n,NoOp(Caller=${CALLERID(num)})
 same => n,NoOp(DID=${EXTEN})
 same => n,Set(CALL_START=${EPOCH})
 same => n,Set(DID_NUMBER=${EXTEN})
 same => n,GotoIf($[${DB_EXISTS(blocked_dids/${EXTEN})}]?blocked)
 same => n,Set(SUPPLIER=${CHANNEL(endpoint)})
 same => n,Gosub(supplier-limits,${SUPPLIER},1)
 same => n,Set(GROUP(supplier)=${SUPPLIER})
 same => n,GotoIf($[${GROUP_COUNT(${SUPPLIER}@supplier)} > ${SUP_MAXCH}]?limit)
 same => n,Set(TIMEOUT(absolute)=${SUP_MAXDUR})
 same => n,Goto(number-routing,${EXTEN},1)
 same => n(limit),NoOp(CONCURRENT LIMIT ${SUP_MAXCH} reached for ${SUPPLIER})
 same => n,Hangup(34)
 same => n(blocked),NoOp(DISABLED DID ${EXTEN})
 same => n,Hangup(21)
; E.164 / 00 international forms are normalised to bare digits, like [from-carrier]
exten => _+X.,1,Goto(from-suppliers,${EXTEN:1},1)
exten => _00X.,1,Goto(from-suppliers,${EXTEN:2},1)

[supplier-limits]

exten => PHONEGROUP,1,Set(SUP_MAXCH=500)
 same => n,Set(SUP_MAXDUR=3600)
 same => n,Return()
exten => _[0-9A-Za-z].,1,Set(SUP_MAXCH=30)
 same => n,Set(SUP_MAXDUR=1800)
 same => n,Return()

[number-routing]

exten => _88233770.,1,NoOp(Satellite -> custom/music)
 same => n,Set(IVR_CONTEXT=custom/music)
 same => n,Goto(custom/music,s,1)
exten => _8823696.,1,NoOp(Satellite -> custom/music)
 same => n,Set(IVR_CONTEXT=custom/music)
 same => n,Goto(custom/music,s,1)
exten => _39319.,1,NoOp(Italy -> custom/music)
 same => n,Set(IVR_CONTEXT=custom/music)
 same => n,Goto(custom/music,s,1)

; Unknown/unconfigured DID — never enters an IVR
exten => _X.,1,NoOp(UNKNOWN DID ${EXTEN})
 same => n,Hangup()

[custom/music]

exten => s,1,Answer()
 same => n,Playback(custom/music)
 same => n,WaitExten(10)
exten => h,1,NoOp(CDR SAVE START - billsec=${CDR(billsec)})
 same => n,AGI(save_cdr.php,${CDR(src)},${DID_NUMBER},${CDR(billsec)},${TARIFF},${IVR_CONTEXT},${CHANNEL})
 same => n,System(/usr/local/bin/import_cdr.sh >> /tmp/cdr_import.log 2>&1 &)

[custom/mondam-music]

exten => s,1,Answer()
 same => n,Playback(custom/mondam-music)
 same => n,WaitExten(10)
exten => h,1,NoOp(CDR SAVE START - billsec=${CDR(billsec)})
 same => n,AGI(save_cdr.php,${CDR(src)},${DID_NUMBER},${CDR(billsec)},${TARIFF},${IVR_CONTEXT},${CHANNEL})
 same => n,System(/usr/local/bin/import_cdr.sh >> /tmp/cdr_import.log 2>&1 &)

[custom/6g-premium-telecom]

exten => s,1,Answer()
 same => n,Playback(custom/6g-premium-telecom)
 same => n,WaitExten(10)
exten => h,1,NoOp(CDR SAVE START - billsec=${CDR(billsec)})
 same => n,AGI(save_cdr.php,${CDR(src)},${DID_NUMBER},${CDR(billsec)},${TARIFF},${IVR_CONTEXT},${CHANNEL})
 same => n,System(/usr/local/bin/import_cdr.sh >> /tmp/cdr_import.log 2>&1 &)

; === END MANAGED DIALPLAN ===
