[general]
static=yes
writeprotect=no

[block-unauthorized]
exten => _X.,1,Hangup(21)

[from-carrier]
exten => _+X.,1,NoOp(6G Premium — Inbound: ${EXTEN})
same => n,Set(CALL_START=${EPOCH})
same => n,AGI(did_router.php)
same => n,Progress()
same => n,Answer()
same => n(loop),Playback(${IVR_CONTEXT})
same => n,GotoIf($["${PLAYBACKSTATUS}"="SUCCESS"]?loop)
same => n,Hangup()

exten => _00X.,1,Goto(from-carrier,+${EXTEN:2},1)
exten => _X.,1,Goto(from-carrier,+${EXTEN},1)

exten => h,1,NoOp(Call ended billsec=${CDR(billsec)} src=${CDR(src)} dst=${CDR(dst)})
same => n,AGI(save_cdr.php,${CDR(src)},${CDR(dst)},${CDR(billsec)},${TARIFF},${IVR_CONTEXT},${CHANNEL})

[default]
exten => s,1,Hangup(21)
