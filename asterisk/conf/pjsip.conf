[global]
type=global
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=195.200.14.0/24

; SIP auth credentials (MEDIATEL-auth, PHONEGROUP-auth) are not stored in
; this tracked file. They live in pjsip_auth.conf on the Asterisk server,
; outside the git repository — see conf/pjsip_auth.example.conf for the
; expected format and setup instructions.
#include pjsip_auth.conf

[STANDARD]
type=endpoint
context=from-carrier
disallow=all
allow=ulaw
allow=alaw
allow=g729
allow=g722
allow=gsm
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
aors=STANDARD-aor

[STANDARD-aor]
type=aor
max_contacts=10
qualify_frequency=60
contact=sip:52.28.165.40:5060
contact=sip:52.57.172.184:5060

[STANDARD-identify]
type=identify
endpoint=STANDARD
match=157.90.193.196
match=52.28.165.40
match=52.57.172.184
match=35.156.119.128

; ── Mediatel ──────────────────────────────────────────────
[MEDIATEL]
type=endpoint
context=from-carrier
disallow=all
allow=ulaw
allow=alaw
allow=g729
direct_media=no
trust_id_inbound=yes
aors=MEDIATEL-aor

; [MEDIATEL-auth] is defined in pjsip_auth.conf (see #include above).
; Note: [MEDIATEL] does not currently reference an auth= line, so this
; section was not actually applied to inbound authentication before this
; change either — behavior is unchanged.

[MEDIATEL-aor]
type=aor
qualify_frequency=60
max_contacts=5
contact=sip:130.117.83.150:5060

[MEDIATEL-identify]
type=identify
endpoint=MEDIATEL
match=130.117.83.150

; ── Phonegroup SA ──────────────────────────────────────────────
[PHONEGROUP]
type=endpoint
context=from-carrier
disallow=all
allow=alaw
allow=ulaw
allow=g729
allow=g723
direct_media=no
trust_id_inbound=yes
auth=PHONEGROUP-auth
aors=PHONEGROUP-aor

; [PHONEGROUP-auth] is defined in pjsip_auth.conf (see #include above).

[PHONEGROUP-aor]
type=aor
contact=sip:195.81.140.216:5060

[PHONEGROUP-identify]
type=identify
endpoint=PHONEGROUP
match=195.81.140.216
match=80.65.158.216
match=195.81.140.217
match=195.81.140.218
match=80.65.158.217
match=80.65.158.218

; ── Gama (Purple-Number) ──────────────────────────────────────
[GAMA]
type=endpoint
context=from-carrier
disallow=all
allow=ulaw
allow=alaw
allow=g729
direct_media=no
trust_id_inbound=yes
aors=GAMA-aor

[GAMA-aor]
type=aor
max_contacts=5
qualify_frequency=60
contact=sip:185.209.147.14:5060

[GAMA-identify]
type=identify
endpoint=GAMA
match=185.209.147.14
