[global]
type=global
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=195.200.14.0/24

; === BEGIN MANAGED TRUNKS - generated, do not edit ===

[supplier-template](!)
type=endpoint
context=from-suppliers
disallow=all
allow=ulaw
allow=alaw
direct_media=no
trust_id_inbound=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
device_state_busy_at=0

; ── World Premium Telecom ──
[WORLD-PREMIUM-TELECOM](supplier-template)
